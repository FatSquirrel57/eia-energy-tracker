name: EIA Energy Tracker

on:
  workflow_dispatch:

jobs:
  run-tracker:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository files
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run EIA tracker
        env:
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
        run: python explore.py
